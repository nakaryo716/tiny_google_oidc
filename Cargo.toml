[package]
name = "tiny_google_oidc"
version = "0.5.0"
readme = "README.md"
repository = "https://github.com/nakaryo716/tiny_google_oidc.git" 
license = "MIT" 
description = """
Tiny library for Google's OpenID Connect
"""
documentation = "https://docs.rs/tiny_google_oidc" 
keywords = ["oidc", "Authentication", "web-programming"]
edition = "2024"

[dependencies]
base64 = "0.22"
http = "1"
rand = "0.9"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4", "fast-rng"] }

[dev-dependencies]
anyhow = "1"
axum = "0.8" 
axum-extra = { version = "0.10", features = ["cookie"] }
bytes = "1"
dotenvy = "0.15.7"
cookie = "0.18"
hyper ={ version = "1", features = ["server"]}
hyper-util ={ version = "0.1", features = ["full"] }
http-body = "1"
http-body-util = "0.1"
redis = { version = "0.29.2", features = ["tokio-comp", "aio", "connection-manager"]}
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"]}
tracing-subscriber = "0.3"
futures-util = "0.3"

[[example]]
name = "axum_server"
path = "examples/axum_server.rs"

[[example]]
name = "hyper"
path = "examples/hyper/main.rs"

[[example]]
name = "id_token"
path = "examples/id_token.rs"
